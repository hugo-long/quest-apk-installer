name: Build Windows release
# PowerShell 5.1 source files retain their UTF-8 BOM.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows package
        shell: powershell
        run: ./build.ps1
      - name: Publish v0.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'v0.1.0 already exists; leaving published assets unchanged.'
            exit 0
          }
          gh release create v0.1.0 dist/QuestApkInstaller-v0.1.0-Windows.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'v0.1.0 - Quest APK Installer' --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
